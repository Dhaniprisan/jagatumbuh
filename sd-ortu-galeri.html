<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Galeri Kegiatan — JagaTumbuh SD</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<style>
  .filter { display: flex; gap: 8px; overflow-x: auto; padding: 4px 20px 14px; }
  .filter .chip { flex: none; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; cursor: pointer; }
  .filter .chip.active { background: var(--green); color: #fff; border-color: var(--green); }

  .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px 22px; }
  .photo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
  .photo .thumb { height: 130px; display: grid; place-items: center; font-size: 48px; background: linear-gradient(135deg, #E3F0E2, #C4DCC6); }
  .photo:nth-child(2) .thumb { background: linear-gradient(135deg, #FBE9E2, #F2CFC0); }
  .photo:nth-child(3) .thumb { background: linear-gradient(135deg, #FBF0D9, #F2DCAC); }
  .photo:nth-child(4) .thumb { background: linear-gradient(135deg, #E3EFF7, #C7DFEE); }
  .photo:nth-child(5) .thumb { background: linear-gradient(135deg, #EDEBF7, #D6CEEE); }
  .photo:nth-child(6) .thumb { background: linear-gradient(135deg, #E8F2E7, #C9E0CA); }
  .photo .info { padding: 10px; }
  .photo .info b { font-size: 13px; font-weight: 700; display: block; }
  .photo .info span { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="app">

  <div class="statusbar"><span>9:41</span><span class="icons">●●●</span></div>

  <header class="app-header">
    <div class="top">
      <a class="back" href="sd-ortu-beranda.html" aria-label="Kembali"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
      <h1>Galeri Kegiatan</h1>
      <span class="avatar">R</span>
    </div>
    <div class="chip-row" style="margin-top:8px;">
      <span class="chip"><span class="dot">R</span> Raka · Kelas 4A</span>
    </div>
  </header>

  <main class="content" style="padding-top:12px;">

    <div class="filter">
      <span class="chip active">Semua</span>
      <span class="chip">Kelas</span>
      <span class="chip">Ekstrakurikuler</span>
      <span class="chip">Lomba</span>
    </div>

    <div class="gallery">
      <div class="photo"><div class="thumb">🏕️</div><div class="info"><b>Kegiatan Pramuka</b><span>1 Sep 2026</span></div></div>
      <div class="photo"><div class="thumb">🏃</div><div class="info"><b>Class Meeting</b><span>28 Agu 2026</span></div></div>
      <div class="photo"><div class="thumb"></div><div class="info"><b>Seni Lukis</b><span>25 Agu 2026</span></div></div>
      <div class="photo"><div class="thumb">🔬</div><div class="info"><b>Eksperimen IPA</b><span>22 Agu 2026</span></div></div>
      <div class="photo"><div class="thumb">📚</div><div class="info"><b>Perpustakaan Kelas</b><span>18 Agu 2026</span></div></div>
      <div class="photo"><div class="thumb">🎭</div><div class="info"><b>Pentas Seni</b><span>15 Agu 2026</span></div></div>
    </div>

  </main>

  <nav class="bottom-nav">
    <a class="nav-item" href="sd-ortu-beranda.html"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></span>Beranda</a>
    <a class="nav-item" href="sd-ortu-jadwal.html"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg></span>Jadwal</a>
    <a class="nav-item" href="sd-ortu-nilai.html"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v6"/></svg></span>Nilai</a>
    <a class="nav-item" href="sd-ortu-absensi.html"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><circle cx="12" cy="10" r="3"/><path d="M12 14a5 5 0 0 0-5 5h10a5 5 0 0 0-5-5z"/></svg></span>Absensi</a>
    <a class="nav-item" href="sd-ortu-chat.html"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg></span>Pesan</a>
  </nav>

</div>
</body>
</html>
