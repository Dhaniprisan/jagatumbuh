<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Unggah Momen — Guru · JagaTumbuh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<style>
  .upload { border: 2px dashed var(--line); border-radius: var(--radius); padding: 30px 20px; text-align: center; background: var(--surface); margin-bottom: 16px; }
  .upload .big { font-size: 34px; }
  .upload b { display: block; font-size: 15px; margin-top: 8px; }
  .upload span { font-size: 12px; color: var(--muted); }
  .field { margin-bottom: 16px; }
  .field label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; }
  .field input, .field textarea { width: 100%; font-family: var(--font); font-size: 13.5px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); }
  .field textarea { height: 70px; resize: none; }
  .send { width: 100%; padding: 16px; border-radius: 16px; border: none; background: var(--coral); color: #fff; font-family: var(--font); font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 22px; }
  .send:active { background: var(--coral-dark); }
  .shared { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .sh { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--surface); }
  .sh .thumb { height: 110px; display: grid; place-items: center; font-size: 34px; }
  .sh .cap { padding: 9px 12px; font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; }
  .sh .cap .n { color: var(--muted); font-weight: 500; }
  .g1 { background: linear-gradient(135deg, #E3F0E2, #C4DCC6); }
  .g2 { background: linear-gradient(135deg, #FBE9E2, #F2CFC0); }
  .g3 { background: linear-gradient(135deg, #E3EFF7, #C7DFEE); }
  .g4 { background: linear-gradient(135deg, #FBF0D9, #F2DCAC); }
</style>
</head>
<body>
<div class="app">

  <div class="statusbar"><span>9:41</span><span class="icons">●●●</span></div>

  <header class="app-header">
    <div class="top">
      <a class="back" href="role-select.html" aria-label="Kembali">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1>Unggah Momen</h1>
      <span class="avatar">S</span>
    </div>
    <div class="chip-row">
      <span class="chip">Kelas Bunga</span>
      <span class="chip">Terlihat semua orang tua</span>
    </div>
  </header>

  <main class="content">

    <div class="upload">
      <div class="big">📷</div>
      <b>Tambah foto / video</b>
      <span>Maks 10 file · dari galeri atau kamera</span>
    </div>

    <div class="field">
      <label>Judul momen</label>
      <input type="text" placeholder="contoh: Bermain balok bersama" />
    </div>
    <div class="field">
      <label>Catatan (opsional)</label>
      <textarea placeholder="Ceritakan aktivitasnya…"></textarea>
    </div>

    <button class="send">Bagikan ke orang tua ✓</button>

    <div class="section-label"><h2>Momen yang dibagikan</h2></div>
    <div class="shared">
      <div class="sh"><div class="thumb g1">🧩</div><div class="cap">Bermain balok<span class="n">2 jam lalu</span></div></div>
      <div class="sh"><div class="thumb g2">🎨</div><div class="cap">Melukis<span class="n">kemarin</span></div></div>
      <div class="sh"><div class="thumb g3">🛝</div><div class="cap">Perosotan<span class="n">kemarin</span></div></div>
      <div class="sh"><div class="thumb g4">🍽️</div><div class="cap">Makan siang<span class="n">2 hari lalu</span></div></div>
    </div>

  </main>

  <nav class="bottom-nav" style="grid-template-columns: repeat(4, 1fr);">
    <a class="nav-item" href="guru-kelas.html"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg></span>Kelas</a>
    <a class="nav-item" href="guru-input.html"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>Input</a>
    <a class="nav-item active" href="guru-momen.html"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span>Momen</a>
    <a class="nav-item" href="guru-chat.html"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg></span>Chat</a>
  </nav>

</div>
</body>
</html>
