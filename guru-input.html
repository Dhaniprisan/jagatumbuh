<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Input Aktivitas — Guru · JagaTumbuh</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="app.css" />
<style>
  .cat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .cat-head { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 800; margin-bottom: 12px; }
  .cat-head .ico { font-size: 22px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt {
    padding: 10px 16px; border-radius: 999px; font-family: var(--font); font-size: 13.5px; font-weight: 600;
    background: var(--cream); border: 1.5px solid var(--line); color: var(--muted); cursor: pointer;
  }
  .opt.sel { background: var(--green-soft); border-color: var(--green); color: var(--green-dark); font-weight: 700; }
  .note { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
  .note input { flex: 1; font-family: var(--font); font-size: 13px; padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--cream); color: var(--ink); }
  .save {
    width: 100%; padding: 16px; border-radius: 16px; border: none; background: var(--green); color: #fff;
    font-family: var(--font); font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .save:active { background: var(--green-dark); }
</style>
</head>
<body>
<div class="app">

  <div class="statusbar">
    <span>9:41</span>
    <span class="icons">●●●</span>
  </div>

  <header class="app-header">
    <div class="top">
      <a class="back" href="role-select.html" aria-label="Kembali">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <h1>Input Aktivitas</h1>
      <span class="avatar">S</span>
    </div>
    <div class="chip-row">
      <span class="chip"><span class="dot">A</span> Ara · 2 tahun</span>
      <span class="chip">Kelas Bunga</span>
    </div>
  </header>

  <main class="content">

    <div class="cat">
      <div class="cat-head"><span class="ico">🍚</span> Makan</div>
      <div class="opts">
        <button class="opt sel">Porsi habis</button>
        <button class="opt">Porsi setengah</button>
        <button class="opt">Tidak mau</button>
      </div>
      <div class="note"><span style="font-size:13px;color:var(--muted)">Catatan</span><input type="text" placeholder="contoh: bubur ayam + wortel" /></div>
    </div>

    <div class="cat">
      <div class="cat-head"><span class="ico">😴</span> Tidur</div>
      <div class="opts">
        <button class="opt sel">Nyenyak</button>
        <button class="opt">Cukup</button>
        <button class="opt">Sulit tidur</button>
        <button class="opt">Tidak tidur</button>
      </div>
      <div class="note"><span style="font-size:13px;color:var(--muted)">Durasi</span><input type="text" placeholder="contoh: 1,5 jam" /></div>
    </div>

    <div class="cat">
      <div class="cat-head"><span class="ico">🚽</span> Toilet</div>
      <div class="opts">
        <button class="opt">BAB</button>
        <button class="opt sel">BAK</button>
        <button class="opt">Ganti popok</button>
      </div>
    </div>

    <div class="cat">
      <div class="cat-head"><span class="ico">😊</span> Mood</div>
      <div class="opts">
        <button class="opt sel">Ceria</button>
        <button class="opt">Aktif</button>
        <button class="opt">Diam</button>
        <button class="opt">Rewel</button>
      </div>
    </div>

    <button class="save">Simpan aktivitas ✓</button>
    <p style="text-align:center; font-size:12px; color:var(--muted); margin-top:10px;">⏱️ Rata-rata input: 30 detik per anak</p>

  </main>

  <nav class="bottom-nav" style="grid-template-columns: repeat(4, 1fr);">
    <a class="nav-item" href="#"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></svg></span>Kelas</a>
    <a class="nav-item active" href="guru-input.html"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg></span>Input</a>
    <a class="nav-item" href="#"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span>Momen</a>
    <a class="nav-item" href="#"><span class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg></span>Chat</a>
  </nav>

</div>
</body>
</html>
